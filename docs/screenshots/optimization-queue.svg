<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">ProcLens optimization queue</title>
  <desc id="desc">A dark evidence-ledger dashboard showing ranked process recommendations, confidence, impact, risk, evidence, and safe user-controlled actions using illustrative sample data.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#080b0d"/><stop offset="1" stop-color="#101819"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1440" height="900" rx="18" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="1439" height="899" rx="17.5" fill="none" stroke="#e0e8e5" stroke-opacity=".14"/>
  <rect width="72" height="900" rx="18" fill="#080b0d"/>
  <path d="M72 0V900M0 72H72" stroke="#e0e8e5" stroke-opacity=".12"/>
  <rect width="72" height="72" rx="18" fill="#d8ff66"/><rect y="54" width="72" height="18" fill="#d8ff66"/>
  <text x="36" y="44" fill="#080b0d" text-anchor="middle" font-family="Bahnschrift, Segoe UI, sans-serif" font-size="18" font-weight="800">PL</text>
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="10" text-anchor="middle">
    <text x="36" y="135" fill="#65706b">01</text><text x="36" y="179" fill="#65706b">02</text>
    <rect x="17" y="200" width="38" height="38" fill="#d8ff66" fill-opacity=".045" stroke="#e0e8e5" stroke-opacity=".22"/>
    <text x="36" y="223" fill="#d8ff66">03</text><text x="36" y="267" fill="#65706b">04</text>
  </g>
  <circle cx="36" cy="834" r="4" fill="#d8ff66" filter="url(#glow)"/>
  <text x="39" y="872" transform="rotate(-90 39 872)" fill="#89928e" font-family="Cascadia Mono, Consolas, monospace" font-size="9" letter-spacing="2">LOCAL</text>

  <g transform="translate(120 48)">
    <text x="0" y="15" fill="#89928e" font-family="Cascadia Mono, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="2">SYSTEM OBSERVATORY / <tspan fill="#d8ff66">REVIEW</tspan></text>
    <text x="0" y="64" fill="#e8ece8" font-family="Bahnschrift Condensed, Segoe UI, sans-serif" font-size="47" font-weight="600" letter-spacing="-1.7">OPTIMIZATION QUEUE</text>
    <text x="0" y="95" fill="#89928e" font-family="Segoe UI, sans-serif" font-size="13">Evidence first. Decisions stay with you.</text>
    <rect x="946" y="0" width="324" height="72" fill="#d8ff66" fill-opacity=".035" stroke="#e0e8e5" stroke-opacity=".14"/>
    <text x="970" y="23" fill="#89928e" font-family="Cascadia Mono, Consolas, monospace" font-size="9" letter-spacing="1.2">POTENTIAL RECLAIM</text>
    <text x="970" y="50" fill="#d8ff66" font-family="Cascadia Mono, Consolas, monospace" font-size="14" font-weight="700">4.9 GB  +  6.4% CPU</text>
    <text x="1245" y="50" fill="#5f6964" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="9">2 ACTIVE</text>
  </g>

  <!-- Ledger frame -->
  <g transform="translate(120 174)">
    <rect width="1270" height="676" fill="#101417" fill-opacity=".72" stroke="#e0e8e5" stroke-opacity=".14"/>
    <g transform="translate(0 0)">
      <rect width="1270" height="76" fill="#101417"/>
      <text x="26" y="28" fill="#6fe7df" font-family="Cascadia Mono, Consolas, monospace" font-size="10" font-weight="700" letter-spacing="1.7">OPTIMIZATION QUEUE</text>
      <text x="26" y="56" fill="#e8ece8" font-family="Bahnschrift Condensed, Segoe UI, sans-serif" font-size="25">RANKED EVIDENCE LEDGER</text>
      <text x="1244" y="42" fill="#ffb85c" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.2">USER DECISION REQUIRED · NEVER AUTOMATIC</text>
      <path d="M0 76H1270" stroke="#e0e8e5" stroke-opacity=".12"/>
    </g>

    <!-- First recommendation -->
    <g transform="translate(0 76)">
      <rect width="1270" height="326" fill="#101417" fill-opacity=".34"/>
      <path d="M64 0V326" stroke="#e0e8e5" stroke-opacity=".12"/>
      <text x="32" y="34" fill="#59635e" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="700">01</text>
      <text x="90" y="41" fill="#e8ece8" font-family="Bahnschrift Condensed, Segoe UI, sans-serif" font-size="28" font-weight="600">BROWSER WORKSPACE</text>
      <text x="90" y="67" fill="#e8ece8" font-family="Cascadia Mono, Consolas, monospace" font-size="10" font-weight="700">Close gracefully <tspan fill="#89928e">· 7 processes · complete owner group</tspan></text>
      <rect x="1136" y="22" width="108" height="28" fill="none" stroke="#6fe7df" stroke-opacity=".35"/>
      <text x="1190" y="40" fill="#6fe7df" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">CORE ANALYSIS</text>

      <g transform="translate(64 91)">
        <path d="M0 0H1206M0 84H1206" stroke="#e0e8e5" stroke-opacity=".12"/>
        <path d="M284 0V84M586 0V84M824 0V84" stroke="#e0e8e5" stroke-opacity=".12"/>
        <g font-family="Cascadia Mono, Consolas, monospace">
          <text x="26" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">CONFIDENCE</text>
          <text x="26" y="48" fill="#d8ff66" font-size="13" font-weight="700">88%</text>
          <rect x="26" y="62" width="232" height="3" fill="#252b29"/><rect x="26" y="62" width="204" height="3" fill="#d8ff66"/>
          <text x="310" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">EXPECTED IMPACT</text>
          <text x="310" y="48" fill="#e8ece8" font-size="13" font-weight="700">842 MB + 6.4% CPU</text>
          <text x="612" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">ACTION RISK</text>
          <text x="612" y="48" fill="#ffb85c" font-size="13" font-weight="700">MEDIUM</text>
          <text x="850" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">EVIDENCE WINDOW</text>
          <text x="850" y="48" fill="#e8ece8" font-size="13" font-weight="700">60 MIN · 120 SAMPLES</text>
        </g>
      </g>
      <text x="90" y="205" fill="#89928e" font-family="Cascadia Mono, Consolas, monospace" font-size="10"><tspan fill="#e8ece8" font-weight="700">Activity:</tspan> no foreground window or meaningful CPU for 42 minutes.</text>
      <text x="1244" y="205" fill="#89928e" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="10"><tspan fill="#e8ece8" font-weight="700">Safety:</tspan> group resolved; identity rechecked before action.</text>
      <path d="M64 230H1270" stroke="#e0e8e5" stroke-opacity=".12"/>
      <text x="90" y="258" fill="#6fe7df" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1.1">▸  VIEW 4 EVIDENCE ITEMS</text>
      <path d="M64 278H1270" stroke="#e0e8e5" stroke-opacity=".12"/>
      <g font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="700" letter-spacing=".7">
        <rect x="90" y="294" width="86" height="32" fill="none" stroke="#e0e8e5" stroke-opacity=".22"/><text x="133" y="314" fill="#e8ece8" text-anchor="middle">NEEDED</text>
        <rect x="186" y="294" width="104" height="32" fill="none" stroke="#e0e8e5" stroke-opacity=".22"/><text x="238" y="314" fill="#e8ece8" text-anchor="middle">SNOOZE 1H</text>
        <text x="310" y="314" fill="#65706b">Nothing happens without your explicit choice.</text>
        <rect x="1084" y="294" width="160" height="32" fill="none" stroke="#ffb85c" stroke-opacity=".48"/><text x="1164" y="314" fill="#ffb85c" text-anchor="middle">CLOSE GRACEFULLY</text>
      </g>
    </g>

    <!-- Second recommendation -->
    <g transform="translate(0 402)">
      <rect width="1270" height="274" fill="#0d1214"/>
      <path d="M0 0H1270M64 0V274" stroke="#e0e8e5" stroke-opacity=".12"/>
      <text x="32" y="34" fill="#a4ada9" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="11" font-weight="700">02</text>
      <text x="90" y="41" fill="#e8ece8" font-family="Bahnschrift Condensed, Segoe UI, sans-serif" font-size="28" font-weight="600">LOCAL MODEL RUNTIME</text>
      <text x="90" y="67" fill="#e8ece8" font-family="Cascadia Mono, Consolas, monospace" font-size="10" font-weight="700">Investigate <tspan fill="#89928e">· 3 processes · advisory only</tspan></text>
      <rect x="1134" y="22" width="110" height="28" fill="none" stroke="#ffb85c" stroke-opacity=".4"/>
      <text x="1189" y="40" fill="#ffb85c" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="700" letter-spacing="1">CLI AGENT</text>

      <g transform="translate(64 91)">
        <path d="M0 0H1206M0 84H1206" stroke="#e0e8e5" stroke-opacity=".12"/>
        <path d="M284 0V84M586 0V84M824 0V84" stroke="#e0e8e5" stroke-opacity=".12"/>
        <g font-family="Cascadia Mono, Consolas, monospace">
          <text x="26" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">CONFIDENCE</text>
          <text x="26" y="48" fill="#a4ada9" font-size="13" font-weight="700">67%</text>
          <rect x="26" y="62" width="232" height="3" fill="#252b29"/><rect x="26" y="62" width="155" height="3" fill="#89928e"/>
          <text x="310" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">EXPECTED IMPACT</text>
          <text x="310" y="48" fill="#e8ece8" font-size="13" font-weight="700">4.1 GB + 0.8% CPU</text>
          <text x="612" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">ACTION RISK</text>
          <text x="612" y="48" fill="#ffb85c" font-size="13" font-weight="700">MEDIUM</text>
          <text x="850" y="24" fill="#66706b" font-size="8" font-weight="700" letter-spacing="1.2">POLICY</text>
          <text x="850" y="48" fill="#e8ece8" font-size="13" font-weight="700">AGENT CAP · 70% MAX</text>
        </g>
      </g>
      <text x="90" y="205" fill="#89928e" font-family="Cascadia Mono, Consolas, monospace" font-size="10"><tspan fill="#e8ece8" font-weight="700">Activity:</tspan> model remains resident; confirm whether instant inference is still needed.</text>
      <text x="1244" y="205" fill="#ffb85c" text-anchor="end" font-family="Cascadia Mono, Consolas, monospace" font-size="10">Agent recommendations can never execute actions.</text>
      <path d="M64 230H1270" stroke="#e0e8e5" stroke-opacity=".12"/>
      <g font-family="Cascadia Mono, Consolas, monospace" font-size="9" font-weight="700" letter-spacing=".7">
        <rect x="90" y="242" width="86" height="32" fill="none" stroke="#e0e8e5" stroke-opacity=".22"/><text x="133" y="262" fill="#e8ece8" text-anchor="middle">NEEDED</text>
        <rect x="186" y="242" width="104" height="32" fill="none" stroke="#e0e8e5" stroke-opacity=".22"/><text x="238" y="262" fill="#e8ece8" text-anchor="middle">SNOOZE 1H</text>
      </g>
    </g>
  </g>
  <rect x="1162" y="871" width="228" height="19" rx="9.5" fill="#151a1d" stroke="#e0e8e5" stroke-opacity=".14"/>
  <text x="1276" y="884" fill="#89928e" text-anchor="middle" font-family="Cascadia Mono, Consolas, monospace" font-size="8" letter-spacing="1">ILLUSTRATIVE SAMPLE DATA</text>
</svg>
